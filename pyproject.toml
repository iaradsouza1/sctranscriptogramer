[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sctranscriptogramer"
version = "0.0.1.dev0"
description = "System-level differential expression for single-cell, single-nucleus and spatial transcriptomics via transcriptograms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Iara Souza" }]
keywords = [
    "single-cell",
    "spatial-transcriptomics",
    "transcriptogram",
    "systems-biology",
    "differential-expression",
    "scanpy",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Core numeric stack only. Heavier, phase-specific deps live in optional groups
# so the core (windowing + I/O) stays lightweight and easy to install/test.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "anndata>=0.9",
    "pyarrow>=12",
]

[project.optional-dependencies]
sc = ["scanpy>=1.9", "metacells>=0.9"]
spatial = ["squidpy>=1.2"]
de = ["edgepython"]
enrich = ["gseapy>=1.1"]
ids = ["pybiomart", "mygene"]
dask = ["dask[array]"]
graph = ["python-igraph"]
plot = ["matplotlib"]
all = [
    "scanpy>=1.9",
    "metacells>=0.9",
    "squidpy>=1.2",
    "edgepython",
    "gseapy>=1.1",
    "pybiomart",
    "mygene",
    "dask[array]",
    "python-igraph",
    "matplotlib",
    "pooch",
]
dev = ["pytest>=7", "pytest-cov", "mypy", "ruff", "hypothesis"]
docs = ["mkdocs-material", "mkdocstrings[python]", "mkdocs-jupyter"]

[project.urls]
Homepage = "https://github.com/iaradsouza1/sctranscriptogramer"
Issues = "https://github.com/iaradsouza1/sctranscriptogramer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sctranscriptogramer"]

# Bundle the protein ordering assets (parquet) inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/sctranscriptogramer/datasets/_assets" = "sctranscriptogramer/datasets/_assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: marks tests that are slow (e.g. run the real metacells2 pipeline)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src/sctranscriptogramer/_core", "src/sctranscriptogramer/stats"]
