site_name: sctranscriptogramer
site_description: System-level analysis for single-cell, single-nucleus and spatial transcriptomics via transcriptograms
repo_url: https://github.com/iaradsouza1/sctranscriptogramer
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - toc.integrate

nav:
  - Home: index.md
  - Installation: installation.md
  - Concepts:
      - The transcriptogram method: concepts/method.md
      - The pipeline: concepts/pipeline.md
      - Accessing results (AnnData): concepts/data-access.md
      - Statistics & caveats: concepts/statistics.md
  - Quickstart:
      - Differential systems (case/control): quickstart/differential-systems.ipynb
      - Metacell comparison & divergent systems: quickstart/metacell-comparison.ipynb
      - Unsupervised profiles: quickstart/unsupervised-profiles.ipynb
      - Spatial associations: quickstart/spatial-associations.ipynb
  - API reference: api.md

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: false
            separate_signature: true
            show_signature_annotations: true
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - tables
  - toc:
      permalink: true
